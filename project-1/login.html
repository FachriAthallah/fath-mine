<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Fath Mine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-fm sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html"
          ><i class="bi bi-gem"></i> FATH MINE</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menuNav"
          aria-label="Buka menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Beranda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#informasi">Informasi</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="login.html">Login</a>
            </li>
            <li class="nav-item ms-lg-2">
              <a class="btn btn-aksen btn-sm" href="register.html"
                >Registrasi</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4 py-md-5">
      <div class="row justify-content-center">
        <div class="col-xl-10">
          <div class="auth-kartu">
            <div class="auth-foto">
              <div class="auth-foto-isi">
                <h2>Selamat datang kembali</h2>
                <p>Masuk untuk membuka Menu Utama Fath Mine.</p>
              </div>
            </div>

            <div class="auth-form">
              <h2 class="mb-1">Login</h2>
              <p class="text-muted mb-4">
                Masukkan email dan password akun Anda.
              </p>

              <div id="pesan"></div>

              <form id="formLogin" novalidate>
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="nama@contoh.com"
                  />
                </div>
                <div class="mb-4">
                  <label for="password" class="form-label">Password</label>
                  <div class="input-group">
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      placeholder="Password"
                    />
                    <button
                      type="button"
                      class="btn btn-lihat"
                      id="lihatPassword"
                      aria-label="Tampilkan password"
                    >
                      <i class="bi bi-eye"></i>
                    </button>
                  </div>
                </div>
                <button type="submit" class="btn btn-aksen w-100" id="tombol">
                  Login
                </button>
              </form>

              <p class="text-center mt-4 mb-0">
                Belum punya akun? <a href="register.html">Registrasi di sini</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer-fm mt-auto">
      <div class="container">
        @Copyright by 24552011117_Muhammad Fachri Athallah_TIF RP 24E CNS
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
      function tampilkanPesan(jenis, teks) {
        document.getElementById("pesan").innerHTML =
          `<div class="alert alert-${jenis}">${escapeHtml(teks)}</div>`;
      }

      pasangTombolLihat("password", "lihatPassword");

      document
        .getElementById("formLogin")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const tombol = document.getElementById("tombol");

          // Validasi input memakai struktur percabangan if
          if (email === "") {
            tampilkanPesan("danger", "Email wajib diisi.");
          } else if (password === "") {
            tampilkanPesan("danger", "Password wajib diisi.");
          } else {
            tombol.disabled = true;
            try {
              const hasil = await panggilApi("login.php", "POST", {
                email: email,
                password: password,
              });

              // Validasi hasil login memakai if
              if (hasil.success) {
                simpanLogin(hasil.data);
                window.location.href = "menu.html";
              } else {
                tampilkanPesan("danger", hasil.message);
                tombol.disabled = false;
              }
            } catch (error) {
              tampilkanPesan(
                "danger",
                "Tidak dapat terhubung ke server. Pastikan Apache dan MySQL di Laragon menyala.",
              );
              tombol.disabled = false;
            }
          }
        });
    </script>
  </body>
</html>
