<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beranda - Fath Mine</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-fm">
      <div class="container">
        <a class="navbar-brand" href="index.html">FATH MINE</a>
        <button
          class="navbar-toggler navbar-dark"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menuNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Beranda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="login.html">Login</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="register.html">Registrasi</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <header class="hero text-center">
      <div class="container">
        <h1 class="display-4">Fath Mine</h1>
        <p class="lead mb-4">
          Pertambangan emas dan nikel yang mengutamakan keselamatan dan
          keberlanjutan.
        </p>
        <a href="login.html" class="btn btn-emas btn-lg me-2">Login</a>
        <a href="register.html" class="btn btn-outline-light btn-lg"
          >Registrasi</a
        >
      </div>
    </header>

    <main class="container py-5">
      <h2 class="mb-4">Informasi Perusahaan</h2>
      <div class="row g-4" id="daftarInformasi">
        <div class="col-12 text-center text-muted">Memuat informasi...</div>
      </div>
    </main>

    <footer class="footer-fm mt-auto">
      <div class="container">
        @Copyright by 24552011117_Muhammad Fachri Athallah_TIF RP 24E CNS
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
      async function muatInformasi() {
        const wadah = document.getElementById("daftarInformasi");

        try {
          const hasil = await panggilApi("informasi.php");

          if (hasil.success && hasil.data.length > 0) {
            wadah.innerHTML = "";
            hasil.data.forEach(function (item) {
              wadah.innerHTML += `
                            <div class="col-md-6 col-lg-4">
                                <div class="card kartu-info h-100 shadow-sm">
                                    <div class="card-body d-flex flex-column">
                                        <h5 class="card-title">${escapeHtml(item.judul)}</h5>
                                        <p class="card-text text-muted">${escapeHtml(item.ringkasan)}</p>
                                        <a href="detail.html?id=${item.id}" class="btn btn-emas mt-auto">Lihat Detail</a>
                                    </div>
                                </div>
                            </div>`;
            });
          } else {
            wadah.innerHTML = `<div class="col-12"><div class="alert alert-warning">Belum ada informasi yang tersedia.</div></div>`;
          }
        } catch (error) {
          wadah.innerHTML = `<div class="col-12"><div class="alert alert-danger">Informasi gagal dimuat. Pastikan Apache dan MySQL di Laragon menyala.</div></div>`;
        }
      }

      muatInformasi();
    </script>
  </body>
</html>
