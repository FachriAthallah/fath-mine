<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detail Informasi - Fath Mine</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-fm">
      <div class="container">
        <a class="navbar-brand" href="index.html">FATH MINE</a>
        <button
          class="navbar-toggler navbar-dark"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menuNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Beranda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="login.html">Login</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="register.html">Registrasi</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <a href="index.html" class="btn btn-outline-secondary mb-4"
        >&larr; Kembali ke Beranda</a
      >
      <div id="isiDetail" class="text-muted">Memuat detail...</div>
    </main>

    <footer class="footer-fm mt-auto">
      <div class="container">
        @Copyright by 24552011117_Muhammad Fachri Athallah_TIF RP 24E CNS
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
      async function muatDetail() {
        const wadah = document.getElementById("isiDetail");
        const id = new URLSearchParams(window.location.search).get("id");

        if (!id) {
          wadah.innerHTML = `<div class="alert alert-warning">Informasi belum dipilih. Silakan pilih dari halaman beranda.</div>`;
          return;
        }

        try {
          const hasil = await panggilApi(
            "informasi.php?id=" + encodeURIComponent(id),
          );

          if (hasil.success) {
            const item = hasil.data;
            document.title = item.judul + " - Fath Mine";
            wadah.className = "";
            wadah.innerHTML = `
                        <div class="card kartu-info shadow-sm">
                            <div class="card-body p-4 p-md-5">
                                <h1 class="mb-3">${escapeHtml(item.judul)}</h1>
                                <p class="lead text-muted">${escapeHtml(item.ringkasan)}</p>
                                <hr>
                                <p style="line-height: 1.8;">${escapeHtml(item.isi)}</p>
                            </div>
                        </div>`;
          } else {
            wadah.innerHTML = `<div class="alert alert-warning">${escapeHtml(hasil.message)}</div>`;
          }
        } catch (error) {
          wadah.innerHTML = `<div class="alert alert-danger">Detail gagal dimuat. Pastikan Apache dan MySQL di Laragon menyala.</div>`;
        }
      }

      muatDetail();
    </script>
  </body>
</html>
