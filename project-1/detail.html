    <main class="container py-4 py-md-5">
      <a href="index.html#informasi" class="btn btn-kembali mb-4"
        ><i class="bi bi-arrow-left"></i> Kembali ke Beranda</a
      >

        <div class="text-center py-5">

    <footer class="footer-fm mt-auto">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
      async function muatInformasiLain(idSekarang) {
        const wadah = document.getElementById("daftarLain");

        try {
          const hasil = await panggilApi("informasi.php");

          if (hasil.success) {
            const lain = hasil.data.filter(function (x) {
              return Number(x.id) !== Number(idSekarang);
            });

            wadah.innerHTML = lain
              .map(function (x) {
                const thumb = x.gambar
                  ? `<img src="img/${encodeURIComponent(x.gambar)}" alt="" loading="lazy" onerror="this.remove()">`
                  : `<div class="thumb-kosong"></div>`;

                return `
                            <a class="item-lain" href="detail.html?id=${encodeURIComponent(x.id)}">
                                ${thumb}
                                <span class="judul-lain">${escapeHtml(x.judul)}</span>
                            </a>`;
              })
              .join("");
          }
        } catch (error) {
          wadah.innerHTML = "";
        }
      }

      async function muatDetail() {
        const wadah = document.getElementById("isiDetail");
        const id = new URLSearchParams(window.location.search).get("id");

        if (!id) {
          wadah.innerHTML = `<div class="alert alert-warning">Informasi belum dipilih. Silakan pilih dari halaman beranda.</div>`;
          return;
        }

        try {
          const hasil = await panggilApi(
            "informasi.php?id=" + encodeURIComponent(id),
          );

          if (hasil.success) {
            const item = hasil.data;
            document.title = item.judul + " - Fath Mine";

            const gambar = item.gambar
              ? `<img src="img/${encodeURIComponent(item.gambar)}" alt="${escapeHtml(item.judul)}" onerror="this.remove()">`
              : "";

            wadah.innerHTML = `
                        <div class="banner-detail mb-4">
                            ${gambar}
                            <div class="banner-isi">
                                <span class="hero-label">INFORMASI PERUSAHAAN</span>
                                <h1>${escapeHtml(item.judul)}</h1>
                                <p>${escapeHtml(item.ringkasan)}</p>
                            </div>
                        </div>

                        <div class="row g-4">
                            <div class="col-lg-8">
                                <article class="panel-isi">
                                    <p class="teks-detail">${escapeHtml(item.isi)}</p>
                                </article>
                            </div>
                            <div class="col-lg-4">
                                <aside class="panel-isi">
                                    <h5 class="mb-3">Informasi Lainnya</h5>
                                    <div id="daftarLain"></div>
                                </aside>
                            </div>
                        </div>`;

            muatInformasiLain(item.id);
          } else {
            wadah.innerHTML = `<div class="alert alert-warning">${escapeHtml(hasil.message)}</div>`;
          }
        } catch (error) {
          wadah.innerHTML = `<div class="alert alert-danger">Detail gagal dimuat. Pastikan Apache dan MySQL di Laragon menyala.</div>`;
        }
      }

      muatDetail();
    </script>
  </body>
